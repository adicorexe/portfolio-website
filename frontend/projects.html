  <script>
    // Fetch projects from the backend API and render them.
    // Falls back to a static message if the API is unreachable.
    const API_BASE_URL = window.PORTFOLIO_API_BASE || "http://localhost:5000/api";

    async function loadAllProjects() {
      const grid = document.getElementById("allProjectsGrid");
      try {
        const res = await fetch(`${API_BASE_URL}/projects`);
        if (!res.ok) throw new Error("Request failed");
        const data = await res.json();
        const projects = data.data || [];

        if (!projects.length) {
          grid.innerHTML = `<p class="loading-text">No projects found yet. Check back soon!</p>`;
          return;
        }

        grid.innerHTML = projects.map(p => `
          <div class="project-card reveal-up">
            <div class="project-image"><i class="fa-solid fa-code"></i></div>
            <div class="project-body">
              <h3>${p.title}</h3>
              <p>${p.description}</p>
              <div class="tech-tags">
                ${(p.techStack || []).map(t => `<span>${t}</span>`).join("")}
              </div>
              <div class="project-links">
                ${p.liveDemo ? `<a href="${p.liveDemo}" target="_blank" rel="noopener" class="btn btn-sm btn-primary"><i class="fa-solid fa-arrow-up-right-from-square"></i> Live Demo</a>` : ""}
                ${p.github ? `<a href="${p.github}" target="_blank" rel="noopener" class="btn btn-sm btn-outline"><i class="fa-brands fa-github"></i> GitHub</a>` : ""}
              </div>
            </div>
          </div>
        `).join("");
      } catch (err) {
        grid.innerHTML = `<p class="loading-text">Couldn't load projects from the server right now. Please try again later.</p>`;
        console.error("Failed to load projects:", err);
      }
    }

    document.addEventListener("DOMContentLoaded", loadAllProjects);
  </script>
